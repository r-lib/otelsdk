on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: linux.yaml

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.config.container }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { container: rockylinux:8, r: release }
          - { container: ghcr.io/r-hub/containers/clang20, r: none }
          - { container: alpine:latest, r: release }
    container:
      image: ${{ matrix.config.container }}

    steps:
      - name: Install R
        run: |
          apk add --no-cache bash curl git findutils perl build-base gfortran ||
            yum install -y findutils perl ||
            (apt-get update && apt-get install -y findutils perl curl)
          curl -LsSf https://r-lib.github.io/rig/install.sh | sh
          curl -o /usr/local/bin/checkbashisms \
              https://raw.githubusercontent.com/r-hub/containers/main/dependencies/checkbashisms/checkbashisms && \
              chmod +x /usr/local/bin/checkbashisms
          if [ "${{ matrix.config.r }}" != "none" ]; then ~/.local/bin/rig add ${{ matrix.config.r }}; fi
        shell: sh

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
        env:
          NOT_CRAN: true
